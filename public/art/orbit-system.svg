<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" role="img" aria-label="Orbital diagram of a connected growth system">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c78e" stop-opacity="0.45"/>
      <stop offset="58%" stop-color="#0a7a56" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#04110b" stop-opacity="0.9"/>
    </radialGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c78e" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7ee8c0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#22c78e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity: .3; transform: scale(.85); } 50% { opacity: .95; transform: scale(1.35); } }
    .spin { animation: spin 220s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin-rev { animation: spin 170s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
    .pulse { animation: pulse 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { .spin, .spin-rev, .pulse { animation: none; } }
  </style>

  <rect width="600" height="600" fill="#04110b"/>

  <!-- tick ring -->
  <g stroke="#7ee8c0" opacity="0.3">
    <line x1="300" y1="28" x2="300" y2="18" stroke-width="1.2"/>
    <line x1="338" y1="30" x2="336" y2="23" stroke-width="0.6"/>
    <line x1="375" y1="38" x2="371" y2="31" stroke-width="0.6"/>
    <line x1="410" y1="52" x2="405" y2="46" stroke-width="0.6"/>
    <line x1="442" y1="72" x2="436" y2="67" stroke-width="0.6"/>
    <line x1="470" y1="98" x2="464" y2="94" stroke-width="0.6"/>
    <line x1="492" y1="128" x2="486" y2="125" stroke-width="1.2"/>
    <line x1="510" y1="162" x2="505" y2="160" stroke-width="0.6"/>
    <line x1="522" y1="198" x2="517" y2="197" stroke-width="0.6"/>
    <line x1="528" y1="236" x2="523" y2="236" stroke-width="0.6"/>
    <line x1="528" y1="274" x2="523" y2="275" stroke-width="0.6"/>
    <line x1="522" y1="312" x2="517" y2="314" stroke-width="0.6"/>
    <line x1="510" y1="348" x2="505" y2="351" stroke-width="1.2"/>
    <line x1="492" y1="382" x2="486" y2="386" stroke-width="0.6"/>
    <line x1="470" y1="412" x2="464" y2="416" stroke-width="0.6"/>
    <line x1="442" y1="438" x2="436" y2="443" stroke-width="0.6"/>
    <line x1="410" y1="458" x2="405" y2="464" stroke-width="0.6"/>
    <line x1="375" y1="472" x2="371" y2="479" stroke-width="0.6"/>
    <line x1="338" y1="480" x2="336" y2="487" stroke-width="1.2"/>
    <line x1="300" y1="482" x2="300" y2="490" stroke-width="0.6"/>
    <line x1="262" y1="480" x2="264" y2="487" stroke-width="0.6"/>
    <line x1="225" y1="472" x2="229" y2="479" stroke-width="0.6"/>
    <line x1="190" y1="458" x2="195" y2="464" stroke-width="0.6"/>
    <line x1="158" y1="438" x2="164" y2="443" stroke-width="0.6"/>
    <line x1="130" y1="412" x2="136" y2="416" stroke-width="1.2"/>
    <line x1="108" y1="382" x2="114" y2="386" stroke-width="0.6"/>
    <line x1="90" y1="348" x2="95" y2="351" stroke-width="0.6"/>
    <line x1="78" y1="312" x2="83" y2="314" stroke-width="0.6"/>
    <line x1="72" y1="274" x2="77" y2="275" stroke-width="0.6"/>
    <line x1="72" y1="236" x2="77" y2="236" stroke-width="0.6"/>
    <line x1="78" y1="198" x2="83" y2="197" stroke-width="0.6"/>
    <line x1="90" y1="162" x2="95" y2="160" stroke-width="0.6"/>
    <line x1="108" y1="128" x2="114" y2="125" stroke-width="1.2"/>
    <line x1="130" y1="98" x2="136" y2="94" stroke-width="0.6"/>
    <line x1="158" y1="72" x2="164" y2="67" stroke-width="0.6"/>
    <line x1="190" y1="52" x2="195" y2="46" stroke-width="0.6"/>
    <line x1="225" y1="38" x2="229" y2="31" stroke-width="0.6"/>
    <line x1="262" y1="30" x2="264" y2="23" stroke-width="0.6"/>
  </g>

  <circle cx="300" cy="300" r="286" fill="none" stroke="#7ee8c0" stroke-opacity="0.12"/>
  <circle class="spin" cx="300" cy="300" r="232" fill="none" stroke="#7ee8c0" stroke-opacity="0.24" stroke-dasharray="3 12"/>
  <circle cx="300" cy="300" r="180" fill="none" stroke="#7ee8c0" stroke-opacity="0.14"/>
  <circle class="spin-rev" cx="300" cy="300" r="128" fill="none" stroke="#7ee8c0" stroke-opacity="0.2" stroke-dasharray="2 9"/>
  <circle cx="300" cy="300" r="76" fill="none" stroke="#7ee8c0" stroke-opacity="0.12"/>
  <circle class="spin" cx="300" cy="300" r="232" fill="none" stroke="url(#arc)" stroke-width="2" stroke-dasharray="170 1290" stroke-linecap="round"/>

  <!-- nodes -->
  <g>
    <circle class="pulse" cx="300" cy="68" r="12" fill="#22c78e" opacity="0.14"/>
    <circle cx="300" cy="68" r="5.5" fill="#22c78e" filter="url(#glow)"/>
    <circle cx="300" cy="68" r="2" fill="#eafff5"/>
  </g>
  <g>
    <circle class="pulse" cx="521" cy="228" r="12" fill="#22c78e" opacity="0.14" style="animation-delay:.7s"/>
    <circle cx="521" cy="228" r="5.5" fill="#22c78e" filter="url(#glow)"/>
    <circle cx="521" cy="228" r="2" fill="#eafff5"/>
  </g>
  <g>
    <circle class="pulse" cx="437" cy="489" r="12" fill="#22c78e" opacity="0.14" style="animation-delay:1.4s"/>
    <circle cx="437" cy="489" r="5.5" fill="#22c78e" filter="url(#glow)"/>
    <circle cx="437" cy="489" r="2" fill="#eafff5"/>
  </g>
  <g>
    <circle class="pulse" cx="163" cy="489" r="12" fill="#22c78e" opacity="0.14" style="animation-delay:2.1s"/>
    <circle cx="163" cy="489" r="5.5" fill="#22c78e" filter="url(#glow)"/>
    <circle cx="163" cy="489" r="2" fill="#eafff5"/>
  </g>
  <g>
    <circle class="pulse" cx="79" cy="228" r="12" fill="#22c78e" opacity="0.14" style="animation-delay:2.8s"/>
    <circle cx="79" cy="228" r="5.5" fill="#22c78e" filter="url(#glow)"/>
    <circle cx="79" cy="228" r="2" fill="#eafff5"/>
  </g>

  <!-- centre -->
  <circle cx="300" cy="300" r="60" fill="url(#core)" stroke="#7ee8c0" stroke-opacity="0.35"/>
  <circle cx="300" cy="300" r="4" fill="#eafff5" filter="url(#glow)"/>

  <text x="300" y="294" text-anchor="middle" fill="#7ee8c0" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" font-weight="600" letter-spacing="2">ONE SYSTEM</text>
  <text x="300" y="312" text-anchor="middle" fill="#ffffff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="500">Enquiry to meeting</text>
</svg>
