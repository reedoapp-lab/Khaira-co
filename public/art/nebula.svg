<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Emerald nebula with stars and orbital arcs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03110a"/>
      <stop offset="48%" stop-color="#072a1c"/>
      <stop offset="100%" stop-color="#04150e"/>
    </linearGradient>
    <radialGradient id="emerald" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c78e" stop-opacity="0.5"/>
      <stop offset="52%" stop-color="#0a7a56" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0a7a56" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mint" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ee8c0" stop-opacity="0.34"/>
      <stop offset="55%" stop-color="#22c78e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#22c78e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0a7a56" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#065c40" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#065c40" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c78e" stop-opacity="0"/>
      <stop offset="28%" stop-color="#7ee8c0" stop-opacity="0.55"/>
      <stop offset="62%" stop-color="#0a7a56" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c78e" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aurora2" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0%" stop-color="#0a7a56" stop-opacity="0"/>
      <stop offset="42%" stop-color="#22c78e" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7ee8c0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="comet" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7ee8c0" stop-opacity="0"/>
      <stop offset="55%" stop-color="#7ee8c0" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#eafff5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="78%">
      <stop offset="54%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="glow" x="-140%" y="-140%" width="380%" height="380%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes drift { 0%,100% { transform: translate(-14px, 8px) scale(1); } 50% { transform: translate(20px, -14px) scale(1.04); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes dash { to { stroke-dashoffset: -260; } }
    .drift { animation: drift 24s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .drift-slow { animation: drift 36s ease-in-out infinite reverse; transform-box: fill-box; transform-origin: center; }
    .spin { animation: spin 220s linear infinite; transform-box: fill-box; transform-origin: center; }
    .spin-rev { animation: spin 170s linear infinite reverse; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: twinkle 6s ease-in-out infinite; }
    .comet { animation: dash 20s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .drift, .drift-slow, .spin, .spin-rev, .twinkle, .comet { animation: none; } }
  </style>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <g opacity="0.95">
    <ellipse class="drift" cx="330" cy="240" rx="580" ry="370" fill="url(#emerald)"/>
    <ellipse class="drift-slow" cx="1290" cy="170" rx="470" ry="310" fill="url(#mint)"/>
    <ellipse cx="820" cy="830" rx="740" ry="310" fill="url(#teal)"/>
  </g>
  <g opacity="0.62">
    <path class="drift-slow" d="M-120 630 C 250 520, 480 710, 820 600 S 1380 430, 1730 540" stroke="url(#aurora)" stroke-width="96" fill="none"/>
    <path class="drift" d="M-140 300 C 230 210, 520 370, 860 280 S 1400 130, 1730 220" stroke="url(#aurora2)" stroke-width="58" fill="none"/>
  </g>
  <g fill="none" stroke="#7ee8c0" opacity="0.22">
    <ellipse class="spin" cx="800" cy="450" rx="630" ry="255" stroke-width="1" stroke-dasharray="2 11"/>
    <ellipse cx="800" cy="450" rx="490" ry="196" stroke-width="1"/>
    <ellipse class="spin-rev" cx="800" cy="450" rx="352" ry="140" stroke-width="1" stroke-dasharray="1 9"/>
  </g>
  <path class="comet" d="M170 720 C 470 540, 780 390, 1210 232" fill="none" stroke="url(#comet)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 16"/>
  <g fill="#eafff5">
    <circle cx="118" cy="146" r="1.4" opacity="0.6" class="twinkle"/>
    <circle cx="246" cy="82" r="1" opacity="0.45" class="twinkle" style="animation-delay:.6s"/>
    <circle cx="338" cy="212" r="1.8" opacity="0.8" class="twinkle" style="animation-delay:1.2s"/>
    <circle cx="452" cy="128" r="1.1" opacity="0.5" class="twinkle" style="animation-delay:2s"/>
    <circle cx="586" cy="248" r="1.5" opacity="0.65" class="twinkle" style="animation-delay:.9s"/>
    <circle cx="642" cy="96" r="1.2" opacity="0.5" class="twinkle" style="animation-delay:3s"/>
    <circle cx="742" cy="188" r="1.7" opacity="0.7" class="twinkle" style="animation-delay:1.6s"/>
    <circle cx="884" cy="322" r="1.6" opacity="0.75" class="twinkle" style="animation-delay:.3s"/>
    <circle cx="964" cy="118" r="1.2" opacity="0.55" class="twinkle" style="animation-delay:2.4s"/>
    <circle cx="1068" cy="226" r="1.5" opacity="0.6" class="twinkle" style="animation-delay:1.1s"/>
    <circle cx="1186" cy="88" r="1.1" opacity="0.45" class="twinkle" style="animation-delay:3.4s"/>
    <circle cx="1290" cy="132" r="2.3" opacity="0.9" class="twinkle" style="animation-delay:1.8s"/>
    <circle cx="1382" cy="264" r="1.4" opacity="0.6" class="twinkle" style="animation-delay:.7s"/>
    <circle cx="1466" cy="402" r="1.2" opacity="0.5" class="twinkle" style="animation-delay:2.8s"/>
    <circle cx="1420" cy="512" r="1.8" opacity="0.7" class="twinkle" style="animation-delay:4.2s"/>
    <circle cx="1298" cy="602" r="1.3" opacity="0.55" class="twinkle" style="animation-delay:1.5s"/>
    <circle cx="1182" cy="724" r="1.6" opacity="0.65" class="twinkle" style="animation-delay:2.1s"/>
    <circle cx="1082" cy="642" r="3" opacity="0.9" class="twinkle" style="animation-delay:3.1s"/>
    <circle cx="942" cy="782" r="1.2" opacity="0.5" class="twinkle" style="animation-delay:.5s"/>
    <circle cx="802" cy="686" r="1.5" opacity="0.6" class="twinkle" style="animation-delay:2.6s"/>
    <circle cx="662" cy="802" r="1.1" opacity="0.45" class="twinkle" style="animation-delay:1.9s"/>
    <circle cx="486" cy="742" r="2.2" opacity="0.8" class="twinkle" style="animation-delay:2.2s"/>
    <circle cx="352" cy="824" r="1.3" opacity="0.55" class="twinkle" style="animation-delay:.8s"/>
    <circle cx="218" cy="642" r="1.4" opacity="0.6" class="twinkle" style="animation-delay:3.6s"/>
    <circle cx="120" cy="520" r="1.7" opacity="0.7" class="twinkle" style="animation-delay:2.7s"/>
    <circle cx="236" cy="188" r="2.8" opacity="0.95" class="twinkle" style="animation-delay:.4s"/>
    <circle cx="648" cy="96" r="1.6" opacity="0.6" class="twinkle" style="animation-delay:5.1s"/>
  </g>
  <g fill="#d8fff0" filter="url(#glow)">
    <circle cx="236" cy="188" r="2.8" opacity="0.9" class="twinkle"/>
    <circle cx="1290" cy="132" r="2.3" opacity="0.9" class="twinkle" style="animation-delay:1.8s"/>
    <circle cx="1082" cy="642" r="3" opacity="0.9" class="twinkle" style="animation-delay:3.1s"/>
    <circle cx="486" cy="742" r="2.2" opacity="0.85" class="twinkle" style="animation-delay:2.2s"/>
    <circle cx="884" cy="322" r="2" opacity="0.8" class="twinkle" style="animation-delay:.9s"/>
  </g>
  <rect width="1600" height="900" fill="url(#vignette)"/>
</svg>
