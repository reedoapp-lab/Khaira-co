<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Abstract signal field with contour lines and a rising growth path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03110a"/>
      <stop offset="55%" stop-color="#07271a"/>
      <stop offset="100%" stop-color="#04150e"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22c78e" stop-opacity="0.34"/>
      <stop offset="60%" stop-color="#0a7a56" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a7a56" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a7a56" stop-opacity="0.2"/>
      <stop offset="45%" stop-color="#22c78e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7ee8c0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee8c0" stop-opacity="0"/>
      <stop offset="45%" stop-color="#7ee8c0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#22c78e" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.85); } 50% { opacity: .9; transform: scale(1.35); } }
    @keyframes beam { 0%,100% { opacity: .35; } 50% { opacity: .9; } }
    @keyframes dash { to { stroke-dashoffset: -260; } }
    .twinkle { animation: twinkle 6s ease-in-out infinite; }
    .pulse { animation: pulse 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .beam { animation: beam 7s ease-in-out infinite; }
    .dash { animation: dash 20s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .twinkle, .pulse, .beam, .dash { animation: none; } }
  </style>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- vertical grid -->
  <g stroke="#7ee8c0" stroke-opacity="0.08">
    <line x1="0" y1="0" x2="0" y2="600"/>
    <line x1="100" y1="0" x2="100" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="500" y1="0" x2="500" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="700" y1="0" x2="700" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="900" y1="0" x2="900" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
    <line x1="1100" y1="0" x2="1100" y2="600"/>
    <line x1="1200" y1="0" x2="1200" y2="600"/>
  </g>

  <!-- contour lines -->
  <g fill="none" stroke="#22c78e" stroke-linecap="round" stroke-linejoin="round">
    <path class="dash" d="M -40 70 C 160 30, 320 120, 480 70 S 820 0, 1000 60 S 1200 110, 1240 80" stroke-width="1.2" stroke-opacity="0.18" stroke-dasharray="4 18"/>
    <path d="M -40 104 C 160 64, 320 154, 480 104 S 820 34, 1000 94 S 1200 144, 1240 114" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 138 C 160 98, 320 188, 480 138 S 820 68, 1000 128 S 1200 178, 1240 148" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 172 C 160 132, 320 222, 480 172 S 820 102, 1000 162 S 1200 212, 1240 182" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 206 C 160 166, 320 256, 480 206 S 820 136, 1000 196 S 1200 246, 1240 216" stroke-width="0.7" stroke-opacity="0.12"/>
    <path class="dash" d="M -40 240 C 160 200, 320 290, 480 240 S 820 170, 1000 230 S 1200 280, 1240 250" stroke-width="1.2" stroke-opacity="0.18" stroke-dasharray="4 18"/>
    <path d="M -40 274 C 160 234, 320 324, 480 274 S 820 204, 1000 264 S 1200 314, 1240 284" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 308 C 160 268, 320 358, 480 308 S 820 238, 1000 298 S 1200 348, 1240 318" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 342 C 160 302, 320 392, 480 342 S 820 272, 1000 332 S 1200 382, 1240 352" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 376 C 160 336, 320 426, 480 376 S 820 306, 1000 366 S 1200 416, 1240 386" stroke-width="0.7" stroke-opacity="0.12"/>
    <path class="dash" d="M -40 410 C 160 370, 320 460, 480 410 S 820 340, 1000 400 S 1200 450, 1240 420" stroke-width="1.2" stroke-opacity="0.18" stroke-dasharray="4 18"/>
    <path d="M -40 444 C 160 404, 320 494, 480 444 S 820 374, 1000 434 S 1200 484, 1240 454" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 478 C 160 438, 320 528, 480 478 S 820 408, 1000 468 S 1200 518, 1240 488" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 512 C 160 472, 320 562, 480 512 S 820 442, 1000 502 S 1200 552, 1240 522" stroke-width="0.7" stroke-opacity="0.12"/>
    <path d="M -40 546 C 160 506, 320 596, 480 546 S 820 476, 1000 536 S 1200 586, 1240 556" stroke-width="0.7" stroke-opacity="0.1"/>
  </g>

  <!-- beam -->
  <rect class="beam" x="884" y="40" width="26" height="520" fill="url(#beam)"/>

  <!-- signal area -->
  <path d="M 0 470 L 100 448 L 200 462 L 300 400 L 400 424 L 500 352 L 600 372 L 700 300 L 800 318 L 900 232 L 1000 252 L 1100 170 L 1200 196 L 1200 600 L 0 600 Z" fill="url(#area)"/>
  <path d="M 0 470 L 100 448 L 200 462 L 300 400 L 400 424 L 500 352 L 600 372 L 700 300 L 800 318 L 900 232 L 1000 252 L 1100 170 L 1200 196" fill="none" stroke="url(#line)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- data points -->
  <g>
    <circle class="pulse" cx="0" cy="470" r="9" fill="#22c78e" opacity="0.12"/>
    <circle cx="0" cy="470" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="100" cy="448" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:.35s"/>
    <circle cx="100" cy="448" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="200" cy="462" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:.7s"/>
    <circle cx="200" cy="462" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="300" cy="400" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:1.05s"/>
    <circle cx="300" cy="400" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="400" cy="424" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:1.4s"/>
    <circle cx="400" cy="424" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="500" cy="352" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:1.75s"/>
    <circle cx="500" cy="352" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="600" cy="372" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:2.1s"/>
    <circle cx="600" cy="372" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="700" cy="300" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:2.45s"/>
    <circle cx="700" cy="300" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="800" cy="318" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:2.8s"/>
    <circle cx="800" cy="318" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="900" cy="232" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:3.15s"/>
    <circle cx="900" cy="232" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="1000" cy="252" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:3.5s"/>
    <circle cx="1000" cy="252" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="1100" cy="170" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:3.85s"/>
    <circle cx="1100" cy="170" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="1200" cy="196" r="9" fill="#22c78e" opacity="0.12" style="animation-delay:4.2s"/>
    <circle cx="1200" cy="196" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>

  <!-- floating particles -->
  <g fill="#7ee8c0">
    <circle cx="86" cy="128" r="1.2" opacity="0.4" class="twinkle"/>
    <circle cx="218" cy="72" r="0.9" opacity="0.3" class="twinkle" style="animation-delay:1.1s"/>
    <circle cx="344" cy="186" r="1.4" opacity="0.45" class="twinkle" style="animation-delay:2.3s"/>
    <circle cx="472" cy="92" r="1" opacity="0.35" class="twinkle" style="animation-delay:.7s"/>
    <circle cx="618" cy="158" r="1.3" opacity="0.4" class="twinkle" style="animation-delay:3.2s"/>
    <circle cx="756" cy="66" r="0.8" opacity="0.3" class="twinkle" style="animation-delay:1.8s"/>
    <circle cx="872" cy="148" r="1.5" opacity="0.5" class="twinkle" style="animation-delay:2.7s"/>
    <circle cx="1016" cy="82" r="1" opacity="0.35" class="twinkle" style="animation-delay:.4s"/>
    <circle cx="1138" cy="196" r="1.2" opacity="0.4" class="twinkle" style="animation-delay:3.8s"/>
    <circle cx="146" cy="306" r="0.9" opacity="0.3" class="twinkle" style="animation-delay:2s"/>
    <circle cx="412" cy="268" r="1.3" opacity="0.4" class="twinkle" style="animation-delay:1.4s"/>
    <circle cx="668" cy="238" r="0.8" opacity="0.3" class="twinkle" style="animation-delay:4.1s"/>
    <circle cx="948" cy="312" r="1.1" opacity="0.35" class="twinkle" style="animation-delay:.9s"/>
    <circle cx="1084" cy="386" r="1.4" opacity="0.4" class="twinkle" style="animation-delay:2.5s"/>
    <circle cx="324" cy="512" r="1" opacity="0.3" class="twinkle" style="animation-delay:3.4s"/>
    <circle cx="724" cy="528" r="1.2" opacity="0.35" class="twinkle" style="animation-delay:1.6s"/>
  </g>
</svg>
