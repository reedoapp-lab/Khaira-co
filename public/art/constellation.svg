<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="800" height="560" role="img" aria-label="Constellation map of connected systems">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03110a"/>
      <stop offset="55%" stop-color="#07271a"/>
      <stop offset="100%" stop-color="#04150e"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22c78e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#22c78e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes twinkle { 0%,100% { opacity: .2; } 50% { opacity: .9; } }
    @keyframes pulse { 0%,100% { opacity: .25; transform: scale(.85); } 50% { opacity: .9; transform: scale(1.35); } }
    .spin { animation: spin 240s linear infinite; transform-box: fill-box; transform-origin: center; }
    .twinkle { animation: twinkle 6s ease-in-out infinite; }
    .pulse { animation: pulse 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) { .spin, .twinkle, .pulse { animation: none; } }
  </style>

  <rect width="800" height="560" fill="url(#bg)"/>
  <ellipse cx="400" cy="280" rx="300" ry="190" fill="url(#halo)" opacity="0.35"/>

  <!-- orbit arcs -->
  <g fill="none" stroke="#7ee8c0" stroke-opacity="0.14">
    <ellipse class="spin" cx="400" cy="280" rx="330" ry="220" stroke-dasharray="2 12"/>
    <ellipse cx="400" cy="280" rx="250" ry="160"/>
  </g>

  <!-- constellation edges -->
  <g stroke="#7ee8c0" stroke-opacity="0.32" stroke-width="1">
    <line x1="120" y1="300" x2="250" y2="168"/>
    <line x1="250" y1="168" x2="338" y2="322"/>
    <line x1="338" y1="322" x2="430" y2="118"/>
    <line x1="430" y1="118" x2="520" y2="258"/>
    <line x1="520" y1="258" x2="612" y2="148"/>
    <line x1="612" y1="148" x2="692" y2="330"/>
    <line x1="338" y1="322" x2="520" y2="258"/>
    <line x1="250" y1="168" x2="298" y2="462"/>
    <line x1="298" y1="462" x2="520" y2="470"/>
    <line x1="520" y1="470" x2="662" y2="500"/>
    <line x1="520" y1="258" x2="520" y2="470"/>
    <line x1="120" y1="300" x2="298" y2="462"/>
    <line x1="692" y1="330" x2="662" y2="500"/>
    <line x1="176" y1="118" x2="250" y2="168"/>
    <line x1="742" y1="222" x2="692" y2="330"/>
    <line class="dash" x1="120" y1="300" x2="338" y2="322"/>
  </g>

  <!-- nodes -->
  <g>
    <circle class="pulse" cx="120" cy="300" r="9.6" fill="#22c78e" opacity="0.12"/>
    <circle cx="120" cy="300" r="4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="250" cy="168" r="14.4" fill="#22c78e" opacity="0.12" style="animation-delay:.45s"/>
    <circle cx="250" cy="168" r="6" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="338" cy="322" r="8.2" fill="#22c78e" opacity="0.12" style="animation-delay:.9s"/>
    <circle cx="338" cy="322" r="3.4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="430" cy="118" r="10.6" fill="#22c78e" opacity="0.12" style="animation-delay:1.35s"/>
    <circle cx="430" cy="118" r="4.4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="520" cy="258" r="16.8" fill="#22c78e" opacity="0.12" style="animation-delay:1.8s"/>
    <circle cx="520" cy="258" r="7" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="612" cy="148" r="8.2" fill="#22c78e" opacity="0.12" style="animation-delay:2.25s"/>
    <circle cx="612" cy="148" r="3.4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="692" cy="330" r="12" fill="#22c78e" opacity="0.12" style="animation-delay:2.7s"/>
    <circle cx="692" cy="330" r="5" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="298" cy="462" r="9.6" fill="#22c78e" opacity="0.12" style="animation-delay:3.15s"/>
    <circle cx="298" cy="462" r="4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="520" cy="470" r="8.2" fill="#22c78e" opacity="0.12" style="animation-delay:3.6s"/>
    <circle cx="520" cy="470" r="3.4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="662" cy="500" r="10.6" fill="#22c78e" opacity="0.12" style="animation-delay:4.05s"/>
    <circle cx="662" cy="500" r="4.4" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="176" cy="118" r="7.2" fill="#22c78e" opacity="0.12" style="animation-delay:4.5s"/>
    <circle cx="176" cy="118" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>
  <g>
    <circle class="pulse" cx="742" cy="222" r="7.2" fill="#22c78e" opacity="0.12" style="animation-delay:4.95s"/>
    <circle cx="742" cy="222" r="3" fill="#d8fff0" filter="url(#glow)"/>
  </g>

  <!-- background stars -->
  <g fill="#7ee8c0">
    <circle cx="64" cy="64" r="1.1" opacity="0.4" class="twinkle"/>
    <circle cx="148" cy="212" r="0.8" opacity="0.3" class="twinkle" style="animation-delay:.8s"/>
    <circle cx="226" cy="84" r="1.3" opacity="0.4" class="twinkle" style="animation-delay:1.6s"/>
    <circle cx="318" cy="196" r="0.9" opacity="0.3" class="twinkle" style="animation-delay:2.4s"/>
    <circle cx="392" cy="64" r="1.1" opacity="0.35" class="twinkle" style="animation-delay:.4s"/>
    <circle cx="470" cy="204" r="0.8" opacity="0.3" class="twinkle" style="animation-delay:3.2s"/>
    <circle cx="548" cy="84" r="1.2" opacity="0.4" class="twinkle" style="animation-delay:1.2s"/>
    <circle cx="628" cy="218" r="0.9" opacity="0.3" class="twinkle" style="animation-delay:2.8s"/>
    <circle cx="714" cy="104" r="1.1" opacity="0.35" class="twinkle" style="animation-delay:.6s"/>
    <circle cx="762" cy="392" r="1.3" opacity="0.4" class="twinkle" style="animation-delay:2s"/>
    <circle cx="688" cy="468" r="0.8" opacity="0.3" class="twinkle" style="animation-delay:3.6s"/>
    <circle cx="596" cy="392" r="1" opacity="0.35" class="twinkle" style="animation-delay:1.4s"/>
    <circle cx="448" cy="512" r="0.9" opacity="0.3" class="twinkle" style="animation-delay:4s"/>
    <circle cx="352" cy="408" r="1.2" opacity="0.4" class="twinkle" style="animation-delay:.2s"/>
    <circle cx="238" cy="512" r="0.8" opacity="0.3" class="twinkle" style="animation-delay:2.6s"/>
    <circle cx="96" cy="448" r="1.1" opacity="0.35" class="twinkle" style="animation-delay:1.8s"/>
    <circle cx="44" cy="276" r="0.9" opacity="0.3" class="twinkle" style="animation-delay:3.4s"/>
    <circle cx="744" cy="300" r="1" opacity="0.35" class="twinkle" style="animation-delay:.9s"/>
  </g>
</svg>
